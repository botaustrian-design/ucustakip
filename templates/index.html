<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>AeroRadar Pro</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --bg: #050a14; --panel: #0d1626; --accent: #38bdf8; --text: #f8fafc; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background: var(--bg); color: var(--text); }
        #app-layout { display: flex; height: 100vh; }
        #sidebar { width: 350px; background: var(--panel); border-right: 1px solid #1e293b; display: flex; flex-direction: column; }
        #map { flex-grow: 1; height: 100%; }
        .filter-bar { padding: 15px; border-bottom: 1px solid #1e293b; }
        select { width: 100%; padding: 10px; background: #1e293b; color: white; border: none; border-radius: 4px; }
        #flight-list { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .card { background: #162033; padding: 10px; margin-bottom: 8px; border-radius: 6px; border-left: 4px solid #ccc; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div id="app-layout">
        <div id="sidebar">
            <div class="filter-bar">
                <h3>Havayolu Filtresi</h3>
                <select id="airlineFilter" onchange="App.applyFilter(this.value)">
                    <option value="ALL">Tüm Havayolları</option>
                    <option value="Turkish Airlines">Turkish Airlines</option>
                    <option value="Pegasus">Pegasus</option>
                </select>
            </div>
            <div id="flight-list"></div>
        </div>
        <div id="map"></div>
    </div>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Marka Renkleri
        const airlineColors = {
            "Turkish Airlines": "#FF0000", // THY Kırmızı/Bordo tonu
            "Pegasus": "#FFD700"          // Pegasus Sarı
        };

        const App = {
            map: null,
            markers: [],
            flights: [],

            init() {
                // Haritayı başlat
                this.map = L.map("map").setView([45.0, 15.0], 5);
                L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png").addTo(this.map);
                
                // 1000 Gerçekçi Uçak Simülasyonu
                for(let i = 0; i < 1000; i++) {
                    const airline = (i % 2 === 0) ? "Turkish Airlines" : "Pegasus";
                    this.flights.push({
                        id: i,
                        airline: airline,
                        callsign: (airline === "Turkish Airlines" ? "THY" : "PGT") + i,
                        lat: 35 + Math.random() * 20,
                        lon: -5 + Math.random() * 30,
                        color: airlineColors[airline]
                    });
                }
                this.renderAll(this.flights);
            },
                    applyFilter(value) {
                // Seçilen markaya göre filtrele (Seçilmeyenler haritadan ve listeden uçar)
                const filtered = (value === "ALL") ? this.flights : this.flights.filter(f => f.airline === value);
                this.renderAll(filtered);
            },

            renderAll(data) {
                // Sol Paneli Güncelle
                const list = document.getElementById("flight-list");
                list.innerHTML = "";
                data.slice(0, 100).forEach(f => {
                    const div = document.createElement("div");
                    div.className = "card";
                    div.style.borderLeftColor = f.color;
                    div.innerHTML = "<b>" + f.callsign + "</b> - " + f.airline;
                    list.appendChild(div);
                });

                // Haritadaki Eski İşaretçileri Temizle ve Yeni Filtrelenenleri Bas
                this.markers.forEach(m => this.map.removeLayer(m));
                this.markers = [];
                data.forEach(f => {
                    const marker = L.circleMarker([f.lat, f.lon], {
                        radius: 4,
                        color: f.color,
                        fillOpacity: 1
                    }).addTo(this.map).bindPopup(f.callsign);
                    this.markers.push(marker);
                });
            }
        };

        // Uygulamayı Başlat
        App.init();
    </script>
</body>
</html>
