<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroRadar Pro - Enterprise Full Edition</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #080c14;
            --panel-bg: #111827;
            --accent-neon: #00f2ff;
            --neon-glow: 0 0 10px rgba(0, 242, 255, 0.6), 0 0 20px rgba(0, 242, 255, 0.3);
            --text-main: #f3f4f6;
            --border-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            overflow-x: hidden;
        }

        /* Neon Sınıfları */
        .neon-text {
            color: var(--accent-neon);
            text-shadow: 0 0 8px var(--accent-neon), 0 0 15px var(--accent-neon);
            font-weight: 800;
        }

        .neon-box {
            border: 2px solid var(--accent-neon);
            box-shadow: var(--neon-glow);
            border-radius: 12px;
        }

        /* Başlık ve Üst Alan */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        .settings-btn {
            background: transparent;
            color: var(--text-main);
            padding: 10px 18px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .settings-btn:hover {
            background: rgba(0, 242, 255, 0.1);
        }

        /* Arama Kutusu */
        .search-container {
            margin-bottom: 25px;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px;
            background: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            border-color: var(--accent-neon);
            box-shadow: 0 0 8px rgba(0, 242, 255, 0.4);
        }

        /* İstatistik Kartları Alanı */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .stat-card .value {
            font-size: 1.4rem;
            margin-top: 5px;
        }

        /* Sekme Butonları */
        .tab-container {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            padding: 14px;
            background: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s;
        }

        .tab-btn.active {
            border-color: var(--accent-neon);
            box-shadow: var(--neon-glow);
            color: var(--accent-neon);
        }

        /* Uçuş Kartları Listesi */
        .flight-card {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .flight-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-neon);
        }

        .flight-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .flight-callsign {
            font-size: 1.3rem;
            letter-spacing: 0.5px;
        }

        .flight-details-text {
            color: #9ca3af;
            font-size: 0.95rem;
        }

        /* Tam Ekran Harita */
        #map-full-wrapper {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1000;
            background: var(--bg-color);
        }

        #map-full-wrapper.active {
            display: block;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .map-back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1001;
            padding: 12px 24px;
            background: var(--panel-bg);
            color: var(--accent-neon);
            border: 2px solid var(--accent-neon);
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: var(--neon-glow);
        }

        /* Tam Ekran Modallar */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg-color);
            z-index: 9999;
            padding: 30px;
            overflow-y: auto;
        }

        .modal.active {
            display: block;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .close-modal-btn {
            background: none;
            border: none;
            color: var(--accent-neon);
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
        }

        .lang-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .lang-option-card {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: 0.2s;
        }

        .lang-option-card:hover {
            border-color: var(--accent-neon);
            box-shadow: var(--neon-glow);
        }

        .detail-box {
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            line-height: 1.8;
            font-size: 1.1rem;
        }

        .action-button {
            width: 100%;
            padding: 16px;
            background: transparent;
            color: var(--accent-neon);
            border: 2px solid var(--accent-neon);
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: var(--neon-glow);
            transition: background 0.3s;
        }

        .action-button:hover {
            background: rgba(0, 242, 255, 0.15);
        }
    </style>
</head>
<body>

    <!-- Ana Ekran Üst Bölüm -->
    <header>
        <h1 class="neon-text" data-i18n="app_title">AeroRadar Pro</h1>
        <button onclick="AppUI.openSettings()" class="settings-btn neon-box" data-i18n="btn_settings">⚙ Ayarlar</button>
    </header>

    <!-- Arama Kutusu -->
    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" data-i18n-placeholder="search_placeholder" placeholder="Uçuş kodu veya havayolu ara (örn. THY, DLH)..." oninput="AppCore.filterFlights(this.value)">
    </div>

    <!-- İstatistikler -->
    <div class="stats-grid">
        <div class="stat-card">
            <div style="font-size: 0.85rem; color: #9ca3af;" data-i18n="stat_active">Aktif Uçuş</div>
            <div id="statTotal" class="value neon-text">0</div>
        </div>
        <div class="stat-card">
            <div style="font-size: 0.85rem; color: #9ca3af;" data-i18n="stat_speed">Ortalama Hız</div>
            <div id="statSpeed" class="value neon-text">0 km/h</div>
        </div>
        <div class="stat-card">
            <div style="font-size: 0.85rem; color: #9ca3af;" data-i18n="stat_region">Bölge</div>
            <div class="value neon-text" style="font-size: 1.2rem;">Avrupa</div>
        </div>
    </div>

    <!-- Sekmeler -->
    <div class="tab-container">
        <button id="tabListBtn" onclick="AppCore.switchTab('list')" class="tab-btn active" data-i18n="tab_list">Canlı Liste</button>
        <button id="tabMapBtn" onclick="AppCore.switchTab('map')" class="tab-btn" data-i18n="tab_map">Canlı Harita</button>
    </div>

    <!-- Tam Ekran Harita Konteyneri -->
    <div id="map-full-wrapper">
        <div id="map"></div>
        <button onclick="AppCore.switchTab('list')" class="map-back-btn" data-i18n="btn_back_list">Listeye Dön</button>
    </div>

    <!-- Uçuş Kartları Listesi -->
    <div id="flightCardsContainer"></div>

    <!-- Ayarlar Modalı (Tam Ekran) -->
    <div id="settings-modal" class="modal">
        <div class="modal-header">
            <h2 class="neon-text" data-i18n="settings_title">Uygulama Ayarları</h2>
            <button class="close-modal-btn" onclick="AppUI.closeSettings()">✕</button>
        </div>
        <button onclick="AppUI.openLangModal()" class="action-button" data-i18n="btn_open_lang">Dil Seçeneklerini Yönet</button>
    </div>

    <!-- Dil Seçim Modalı (Tam Ekran) -->
    <div id="lang-modal" class="modal">
        <div class="modal-header">
            <h2 class="neon-text" data-i18n="lang_modal_title">Dil Seçin</h2>
            <button class="close-modal-btn" onclick="AppUI.closeLangModal()">✕</button>
        </div>
        <div id="langListContainer" class="lang-grid"></div>
    </div>

    <!-- Uçuş Detay Modalı (Tam Ekran) -->
    <div id="detail-modal" class="modal">
        <div class="modal-header">
            <h2 class="neon-text" id="detailTitle">Detaylar</h2>
            <button class="close-modal-btn" onclick="AppUI.closeDetail()">✕</button>
        </div>
        <div id="detailContent"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Dil Sözlükleri Altyapısı
        const i18nDict = {
            tr: {
                app_title: "AeroRadar Pro",
                btn_settings: "⚙ Ayarlar",
                search_placeholder: "Uçuş kodu veya havayolu ara (örn. THY, DLH)...",
                stat_active: "Aktif Uçuş",
                stat_speed: "Ortalama Hız",
                stat_region: "Bölge",
                tab_list: "Canlı Liste",
                tab_map: "Canlı Harita",
                btn_back_list: "Listeye Dön",
                settings_title: "Uygulama Ayarları",
                btn_open_lang: "Dil Seçeneklerini Yönet",
                lang_modal_title: "Dil Seçin",
                label_airline: "Havayolu",
                label_route: "Güzergah",
                label_speed: "Hız",
                label_alt: "İrtifa",
                btn_jump: "Ana Sayfada Bu Koda Git"
            },
            en: {
                app_title: "AeroRadar Pro",
                btn_settings: "⚙ Settings",
                search_placeholder: "Search flight code or airline...",
                stat_active: "Active Flights",
                stat_speed: "Avg Speed",
                stat_region: "Region",
                tab_list: "Live List",
                tab_map: "Live Map",
                btn_back_list: "Back to List",
                settings_title: "App Settings",
                btn_open_lang: "Manage Language Options",
                lang_modal_title: "Select Language",
                label_airline: "Airline",
                label_route: "Route",
                label_speed: "Speed",
                label_alt: "Altitude",
                btn_jump: "Jump to Code on Main Page"
            }
        };

        // Dil ve Uçuş Verileri
        const languagesData = [
            { code: 'tr', name: 'Türkçe', flag: '🇹🇷' },
            { code: 'en', name: 'English', flag: '🇬🇧' },
            { code: 'de', name: 'Deutsch', flag: '🇩🇪' },
            { code: 'fr', name: 'Français', flag: '🇫🇷' },
            { code: 'it', name: 'Italiano', flag: '🇮🇹' },
            { code: 'ar', name: 'العربية', flag: '🇸🇦' },
            { code: 'ru', name: 'Русский', flag: '🇷🇺' },
            { code: 'hi', name: 'हिन्दी', flag: '🇮🇳' },
            { code: 'zh', name: '中文', flag: '🇨🇳' }
        ];

        const flightsData = [
            { id: 1, callsign: 'THY1923', airline: 'Turkish Airlines', route: 'IST ➔ LHR', speed: 870, alt: 36000, lat: 41.0082, lon: 28.9784 },
            { id: 2, callsign: 'DLH400', airline: 'Lufthansa', route: 'FRA ➔ JFK', speed: 890, alt: 39000, lat: 50.1109, lon: 8.6821 },
            { id: 3, callsign: 'BAW178', airline: 'British Airways', route: 'LHR ➔ DXB', speed: 910, alt: 40000, lat: 51.4700, lon: -0.4543 },
            { id: 4, callsign: 'PGT321', airline: 'Pegasus', route: 'SAW ➔ BER', speed: 820, alt: 34000, lat: 40.9000, lon: 29.3000 },
            { id: 5, callsign: 'AFR116', airline: 'Air France', route: 'CDG ➔ MAD', speed: 860, alt: 37000, lat: 49.0097, lon: 2.5479 },
            { id: 6, callsign: 'KLM123', airline: 'KLM Royal Dutch', route: 'AMS ➔ VIE', speed: 810, alt: 34000, lat: 52.3105, lon: 4.7683 },
            { id: 7, callsign: 'RYR84C', airline: 'Ryanair', route: 'DUB ➔ BCN', speed: 780, alt: 32000, lat: 53.3498, lon: -6.2603 },
            { id: 8, callsign: 'EZY88J', airline: 'EasyJet', route: 'MXP ➔ LGW', speed: 795, alt: 34000, lat: 45.4642, lon: 9.1900 }
        ];

        let currentLang = 'tr';
        let mapInstance = null;

        // Uygulama Çekirdek Mantığı
        const AppCore = {
            init() {
                this.renderFlights(flightsData);
                this.updateStats(flightsData);
            },

            renderFlights(data) {
                const container = document.getElementById('flightCardsContainer');
                container.innerHTML = '';
                
                data.forEach(f => {
                    const card = document.createElement('div');
                    card.className = 'flight-card';
                    card.id = 'flight-' + f.callsign;
                    card.innerHTML = `
                        <div class="flight-card-header">
                            <span class="neon-text flight-callsign">${f.callsign}</span>
                            <span style="font-size: 0.9rem; color: #9ca3af;">${f.speed} km/h</span>
                        </div>
                        <div class="flight-details-text">${f.airline} | ${f.route}</div>
                        <div style="font-size: 0.8rem; color: #6b7280; margin-top: 6px;">İrtifa: ${f.alt} ft</div>
                    `;
                    card.onclick = () => AppUI.showDetail(f);
                    container.appendChild(card);
                });
            },

            filterFlights(query) {
                const q = query.toUpperCase();
                const filtered = flightsData.filter(f => 
                    f.callsign.toUpperCase().includes(q) || f.airline.toUpperCase().includes(q)
                );
                this.renderFlights(filtered);
                this.updateStats(filtered);
            },

            updateStats(data) {
                document.getElementById('statTotal').innerText = data.length;
                if(data.length > 0) {
                    const avgSpd = Math.round(data.reduce((acc, curr) => acc + curr.speed, 0) / data.length);
                    document.getElementById('statSpeed').innerText = avgSpd + " km/h";
                } else {
                    document.getElementById('statSpeed').innerText = "0 km/h";
                }
            },

            switchTab(tab) {
                const mapWrapper = document.getElementById('map-full-wrapper');
                const btnList = document.getElementById('tabListBtn');
                const btnMap = document.getElementById('tabMapBtn');

                if (tab === 'map') {
                    mapWrapper.classList.add('active');
                    btnMap.classList.add('active');
                    btnList.classList.remove('active');
                    this.initMap();
                } else {
                    mapWrapper.classList.remove('active');
                    btnList.classList.add('active');
                    btnMap.classList.remove('active');
                }
            },

            initMap() {
                if (!mapInstance) {
                    mapInstance = L.map('map').setView([48.5, 14.5], 5);
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                        maxZoom: 19
                    }).addTo(mapInstance);

                    flightsData.forEach(f => {
                        let planeIcon = L.divIcon({
                            html: `<div style="color: #00d4ff; text-shadow: 0 0 8px #00d4ff; font-size: 24px;">✈️</div>`,
                            className: 'neon-plane-marker'
                        });
                        L.marker([f.lat, f.lon], { icon: planeIcon })
                            .addTo(mapInstance)
                            .bindPopup(`<b>${f.callsign}</b><br>${f.airline}`)
                            .on('click', () => AppUI.showDetail(f));
                    });
                }
            },

            setLanguage(langCode) {
                currentLang = langCode;
                const dict = i18nDict[langCode] || i18nDict['tr'];
                
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (dict[key]) el.innerText = dict[key];
                });

                document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                    const key = el.getAttribute('data-i18n-placeholder');
                    if (dict[key]) el.placeholder = dict[key];
                });

                AppUI.closeLangModal();
            },

            jumpToCode(code) {
                AppUI.closeDetail();
                this.switchTab('list');
                setTimeout(() => {
                    const targetCard = document.getElementById('flight-' + code);
                    if (targetCard) {
                        targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        targetCard.style.borderColor = 'var(--accent-neon)';
                        targetCard.style.boxShadow = 'var(--neon-glow)';
                        setTimeout(() => {
                            targetCard.style.borderColor = 'var(--border-color)';
                            targetCard.style.boxShadow = 'none';
                        }, 2500);
                    }
                }, 150);
            }
        };

        // Arayüz Moddal ve Etkileşim Yönetimi
        const AppUI = {
            openSettings() {
                document.getElementById('settings-modal').classList.add('active');
                   // Arayüz Moddal ve Etkileşim Yönetimi
        const AppUI = {
            openSettings() {
                document.getElementById('settings-modal').classList.add('active');
            },
            closeSettings() {
                document.getElementById('settings-modal').classList.remove('active');
            },
            openLangModal() {
                const container = document.getElementById('langListContainer');
                container.innerHTML = '';
                languagesData.forEach(l => {
                    const item = document.createElement('div');
                    item.className = 'lang-option-card';
                    item.innerHTML = `<span style="font-size: 1.1rem; font-weight: bold;">${l.name}</span> <span style="font-size: 1.5rem;">${l.flag}</span>`;
                    item.onclick = () => AppCore.setLanguage(l.code);
                    container.appendChild(item);
                });
                document.getElementById('lang-modal').classList.add('active');
            },
            closeLangModal() {
                document.getElementById('lang-modal').classList.remove('active');
            },
            showDetail(f) {
                const dict = i18nDict[currentLang] || i18nDict['tr'];
                document.getElementById('detailTitle').innerText = f.callsign;
                document.getElementById('detailContent').innerHTML = `
                    <div class="detail-box">
                        <p><strong>${dict.label_airline || 'Havayolu'}:</strong> ${f.airline}</p>
                        <p><strong>${dict.label_route || 'Güzergah'}:</strong> ${f.route}</p>
                        <p><strong>${dict.label_speed || 'Hız'}:</strong> ${f.speed} km/h</p>
                        <p><strong>${dict.label_alt || 'İrtifa'}:</strong> ${f.alt} ft</p>
                    </div>
                    <button onclick="AppCore.jumpToCode('${f.callsign}')" class="action-button">${dict.btn_jump || 'Ana Sayfada Bu Koda Git'}</button>
                `;
                document.getElementById('detail-modal').classList.add('active');
            },
            closeDetail() {
                document.getElementById('detail-modal').classList.remove('active');
            }
        };

        // Uygulamayı Başlat
        AppCore.init();
    </script>
</body>
</html>
