<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uçuş Takip</title>
    <style>
        body {
            margin: 0;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h2 { text-align: center; margin-bottom: 5px; color: #60a5fa; }

        .search-box {
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 1em;
            outline: none;
        }

        input::placeholder { color: rgba(255, 255, 255, 0.6); }

        button {
            padding: 0 20px;
            border-radius: 10px;
            border: none;
            background: #3b82f6;
            color: white;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
        }

        button:active { background: #2563eb; }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            display: none;
        }

        .card h3 { margin-top: 0; color: #93c5fd; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 8px; }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 1.05em;
        }

        .info-row:last-child { border-bottom: none; }
        
        #status-msg {
            text-align: center;
            margin-top: 20px;
            opacity: 0.8;
            font-size: 0.95em;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Uçuş Bilgi Ekranı</h2>
        <div class="search-box">
            <input type="text" id="flight-code" placeholder="Uçuş kodu yazın (Örn: THY, DLH, BAW)">
            <button onclick="searchFlight()">Sorgula</button>
        </div>

        <div id="status-msg">Uçuş kodunu yazıp sorgulayabilirsiniz.</div>

        <div class="card" id="result-card">
            <h3 id="flight-title">Uçuş Detayı</h3>
            <div class="info-row"><span>Ülke / Kaynak:</span> <strong id="f-country">-</strong></div>
            <div class="info-row"><span>Anlık Hız:</span> <strong id="f-speed">-</strong></div>
            <div class="info-row"><span>Anlık Yükseklik:</span> <strong id="f-altitude">-</strong></div>
            <div class="info-row"><span>Enlem / Boylam:</span> <strong id="f-coords">-</strong></div>
        </div>
    </div>

    <script>
        function searchFlight() {
            const query = document.getElementById('flight-code').value.trim().toUpperCase();
            const statusMsg = document.getElementById('status-msg');
            const card = document.getElementById('result-card');

            if (!query) {
                alert('Lütfen bir uçuş kodu girin!');
                return;
            }

            statusMsg.innerText = 'Uçaklar taranıyor, lütfen bekleyin...';
            card.style.display = 'none';

            // CORS engeline takılmamak için köprü (proxy) kullanıyoruz
            const targetUrl = 'https://opensky-network.org/api/states/all';
            const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl);

            fetch(proxyUrl)
                .then(res => res.json())
                .then(data => {
                    if (!data || !data.states) {
                        statusMsg.innerText = 'Veri alınamadı. Tekrar deneyin.';
                        return;
                    }

                    const found = data.states.find(flight => {
                        const callsign = flight[1] ? flight[1].trim().toUpperCase() : '';
                        return callsign.includes(query);
                    });

                    if (found) {
                        statusMsg.innerText = '';
                        card.style.display = 'block';

                        const callsign = found[1] ? found[1].trim() : 'Bilinmiyor';
                        const country = found[2] || 'Bilinmiyor';
                        const lon = found[5];
                        const lat = found[6];
                        
                        // Hız (m/s -> km/h)
                        const speedKmh = found[9] ? Math.round(found[9] * 3.6) : 0;
                        
                        // Yükseklik (Metre -> Feet)
                        const altitudeFt = found[7] ? Math.round(found[7] * 3.28084) : 0;

                        document.getElementById('flight-title').innerText = 'Uçuş: ' + callsign;
                        document.getElementById('f-country').innerText = country;
                        document.getElementById('f-speed').innerText = speedKmh + ' km/h';
                        document.getElementById('f-altitude').innerText = altitudeFt.toLocaleString() + ' ft';
                        document.getElementById('f-coords').innerText = lat ? `${lat.toFixed(2)}, ${lon.toFixed(2)}` : 'Bilinmiyor';
                    } else {
                        statusMsg.innerText = `"${query}" koduna ait şu an havada aktif bir uçuş bulunamadı.`;
                        card.style.display = 'none';
                    }
                })
                .catch(err => {
                    statusMsg.innerText = 'Bağlantı hatası oluştu. İnternetinizi kontrol edin.';
                });
        }
    </script>
</body>
</html>
