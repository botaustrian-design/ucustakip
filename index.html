<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroRadar - CANLI VERİ</title>
    <style>
        :root { --bg-primary: #070d1a; --accent-blue: #38bdf8; --accent-green: #34d399; --text-main: #f8fafc; }
        body { margin: 0; padding: 20px; font-family: sans-serif; background: var(--bg-primary); color: var(--text-main); }
        .flight-card { background: #162033; border: 1px solid #334155; padding: 15px; border-radius: 12px; margin-bottom: 10px; }
        .loading { color: var(--accent-blue); text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <h2 style="text-align:center; color:var(--accent-blue);">Canlı Radar (Gerçek Veri)</h2>
    <div id="status" class="loading">Sunucudan gerçek veriler çekiliyor...</div>
    <div id="feed-container"></div>

    <script>
        async function fetchLiveData() {
            try {
                document.getElementById('status').innerText = "Veri alınıyor...";
                // OpenSky API'sine allorigins üzerinden erişiyoruz
                const response = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://opensky-network.org/api/states/all'));
                const json = await response.json();
                const data = JSON.parse(json.contents);
                
                const container = document.getElementById('feed-container');
                container.innerHTML = '';
                document.getElementById('status').innerText = "Güncel: " + new Date().toLocaleTimeString();

                // İlk 20 THY/Lufthansa/Austrian uçağını filtrele
                let count = 0;
                data.states.forEach(s => {
                    const callsign = s[1] ? s[1].trim() : "";
                    if ((callsign.startsWith('THY') || callsign.startsWith('TK') || callsign.startsWith('DLH') || callsign.startsWith('LH') || callsign.startsWith('AUA') || callsign.startsWith('OS')) && count < 20) {
                        
                        const speed = s[9] ? Math.round(s[9] * 3.6) : 0; // m/s to km/h
                        const alt = s[7] ? Math.round(s[7] * 3.28084) : 0; // meters to ft
                        
                        if (speed > 0) { // Sadece havada olanları göster
                            container.innerHTML += `
                                <div class="flight-card">
                                    <div style="font-weight:bold; font-size:1.2rem;">${callsign}</div>
                                    <div style="color:var(--accent-green);">Hız: ${speed} km/h</div>
                                    <div style="color:var(--accent-blue);">İrtifa: ${alt.toLocaleString()} ft</div>
                                </div>
                            `;
                            count++;
                        }
                    }
                });
            } catch (err) {
                document.getElementById('status').innerText = "Bağlantı hatası: Sunucu cevap vermedi.";
            }
        }

        // Her 15 saniyede bir veriyi tazele
        fetchLiveData();
        setInterval(fetchLiveData, 15000);
    </script>
</body>
</html>
