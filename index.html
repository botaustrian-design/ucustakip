<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroRadar - CANLI VERİ</title>
    <style>
        :root { --bg-primary: #070d1a; --accent-blue: #38bdf8; --accent-green: #34d399; --text-main: #f8fafc; }
        body { margin: 0; padding: 20px; font-family: sans-serif; background: var(--bg-primary); color: var(--text-main); }
        .flight-card { background: #162033; border: 1px solid #334155; padding: 15px; border-radius: 12px; margin-bottom: 10px; }
        .status-box { text-align: center; font-weight: bold; margin-bottom: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <h2 style="text-align:center; color:var(--accent-blue);">Canlı Radar (Gerçek Veri)</h2>
    <div id="status" class="status-box" style="color: var(--accent-blue);">Sunucuya bağlanılıyor...</div>
    <div id="feed-container"></div>

    <script>
        async function fetchLiveData() {
            const statusEl = document.getElementById('status');
            const container = document.getElementById('feed-container');
            
            try {
                statusEl.innerText = "Veri alınıyor...";
                
                // İstek 8 saniyeden uzun sürerse kilitlenmeyi önlemek için iptal et
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);

                const response = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent('https://opensky-network.org/api/states/all'), {
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error("Sunucu yanıt vermedi");
                
                const data = await response.json();
                
                if (!data || !data.states) {
                    throw new Error("Veri alınamadı");
                }

                container.innerHTML = '';
                statusEl.innerText = "Canlı Veri Güncellendi: " + new Date().toLocaleTimeString();
                statusEl.style.color = "var(--accent-green)";

                let count = 0;
                data.states.forEach(s => {
                    const callsign = s[1] ? s[1].trim() : "";
                    if ((callsign.startsWith('THY') || callsign.startsWith('TK') || callsign.startsWith('DLH') || callsign.startsWith('LH') || callsign.startsWith('AUA') || callsign.startsWith('OS')) && count < 20) {
                        
                        const speed = s[9] ? Math.round(s[9] * 3.6) : 0; 
                        const alt = s[7] ? Math.round(s[7] * 3.28084) : 0; 
                        
                        if (speed > 0) { 
                            container.innerHTML += `
                                <div class="flight-card">
                                    <div style="font-weight:bold; font-size:1.2rem; color: #fff;">${callsign}</div>
                                    <div style="color:var(--accent-green); margin-top:5px;">Hız: ${speed} km/h</div>
                                    <div style="color:var(--accent-blue);">İrtifa: ${alt.toLocaleString()} ft</div>
                                </div>
                            `;
                            count++;
                        }
                    }
                });

                if (count === 0) {
                    statusEl.innerText = "Şu an bu havayollarına ait aktif uçuş bulunamadı.";
                    statusEl.style.color = "#fbbf24";
                }

            } catch (err) {
                statusEl.innerText = "Bağlantı Engellendi: OpenSky sunucusu tarayıcı isteklerini reddetti.";
                statusEl.style.color = "#ef4444";
            }
        }

        fetchLiveData();
    </script>
</body>
</html>
