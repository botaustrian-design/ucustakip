<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroRadar Pro - Canlı Gerçek Radar</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #070d1a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            overflow: hidden;
        }
        .header {
            padding: 12px;
            text-align: center;
            background: #0f172a;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        h2 {
            margin: 0;
            color: #38bdf8;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }
        p {
            margin: 4px 0 0 0;
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .radar-container {
            width: 100%;
            height: calc(100vh - 60px);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>AeroRadar Pro</h2>
        <p>GERÇEK ZAMANLI HAVA SAHASI RADARI</p>
    </div>

    <div class="radar-container">
        <!-- Dünya ve Avrupa üzerindeki %100 gerçek uçuşları anlık gösteren profesyonel radar haritası -->
        <iframe src="https://www.flightradar24.com/simple_index.php?lat=45.0&lon=15.0&z=5&pubs=1&label=true" allowfullscreen></iframe>
    </div>

</body>
</html>
