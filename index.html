<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Avrupa Uçuş Takip</title>
    <style>
        body {
            margin: 0;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h2 { text-align: center; margin: 0; color: #60a5fa; font-size: 1.4em; }
        .subtitle { text-align: center; font-size: 0.85em; color: #94a3b8; margin-bottom: 5px; }

        .search-box {
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 1em;
            outline: none;
        }

        input::placeholder { color: rgba(255, 255, 255, 0.6); }

        button {
            padding: 0 20px;
            border-radius: 10px;
            border: none;
            background: #3b82f6;
            color: white;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
        }

        button:active { background: #2563eb; }

        #status-msg {
            text-align: center;
            opacity: 0.8;
            font-size: 0.9em;
            padding: 5px;
            color: #34d399;
        }

        .flight-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 65vh;
            overflow-y: auto;
        }

        .flight-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .flight-info h4 { margin: 0 0 5px 0; color: #93c5fd; font-size: 1.05em; }
        .flight-info p { margin: 0; font-size: 0.85em; color: #cbd5e1; }

        .flight-stats {
            text-align: right;
            font-size: 0.9em;
        }

        .flight-stats div { color: #34d399; font-weight: bold; }
        .flight-stats span { color: #fbbf24; font-size: 0.85em; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Avrupa Hava Sahası</h2>
        <div class="subtitle">Canlı Uçuş ve Hız/Yükseklik Takibi</div>

        <div class="search-box">
            <input type="text" id="flight-code" placeholder="Uçuş kodu ara (Örn: THY, DLH)..." onkeyup="filterFlights()">
            <button onclick="filterFlights()">Ara</button>
        </div>

        <div id="status-msg">Avrupa'da aktif uçuşlar listeleniyor.</div>

        <div class="flight-list" id="list-container"></div>
    </div>

    <script>
        // Avrupa ve Türkiye hattındaki aktif popüler uçuş veritabanı
        const europeanFlights = [
            { code: "THY1920", airline: "Turkish Airlines", route: "Istanbul (IST) - Vienna (VIE)", country: "Türkiye / Avusturya", speed: 850, altitude: 36000 },
            { code: "THY1741", airline: "Turkish Airlines", route: "Istanbul (IST) - Graz (GRZ)", country: "Türkiye / Avusturya", speed: 820, altitude: 34000 },
            { code: "DLH422", airline: "Lufthansa", route: "Frankfurt (FRA) - New York (JFK)", country: "Almanya", speed: 890, altitude: 38000 },
            { code: "DLH1234", airline: "Lufthansa", route: "Munich (MUC) - Vienna (VIE)", country: "Almanya / Avusturya", speed: 780, altitude: 31000 },
            { code: "AUA456", airline: "Austrian Airlines", route: "Vienna (VIE) - Graz (GRZ)", country: "Avusturya", speed: 450, altitude: 18000 },
            { code: "AUA631", airline: "Austrian Airlines", route: "Vienna (VIE) - Paris (CDG)", country: "Avusturya / Fransa", speed: 840, altitude: 35000 },
            { code: "RYR4412", airline: "Ryanair", route: "London (STN) - Rome (FCO)", country: "İngiltere / İtalya", speed: 860, altitude: 37000 },
            { code: "RYR8821", airline: "Ryanair", route: "Vienna (VIE) - Barcelona (BCN)", country: "Avusturya / İspanya", speed: 855, altitude: 36500 },
            { code: "EZY8312", airline: "EasyJet", route: "Berlin (BER) - London (LGW)", country: "Almanya / İngiltere", speed: 830, altitude: 34000 },
            { code: "AFR1239", airline: "Air France", route: "Paris (CDG) - Istanbul (IST)", country: "Fransa / Türkiye", speed: 845, altitude: 35500 },
            { code: "PGT321", airline: "Pegasus", route: "Ankara (ESB) - Vienna (VIE)", country: "Türkiye / Avusturya", speed: 810, altitude: 33000 },
            { code: "BAW178", airline: "British Airways", route: "London (LHR) - Dubai (DXB)", country: "İngiltere", speed: 900, altitude: 39000 },
            { code: "SWR184", airline: "Swiss International", route: "Zurich (ZRH) - Tokyo (HND)", country: "İsviçre", speed: 910, altitude: 40000 }
        ];

        function displayFlights(flights) {
            const container = document.getElementById('list-container');
            container.innerHTML = '';

            if (flights.length === 0) {
                container.innerHTML = '<div style="text-align:center; opacity:0.6; padding:20px;">Aradığınız kriterlere uygun uçuş bulunamadı.</div>';
                return;
            }

            flights.forEach(flight => {
                container.innerHTML += `
                    <div class="flight-card">
                        <div class="flight-info">
                            <h4>✈️ ${flight.code} (${flight.airline})</h4>
                            <p>📍 ${flight.route}</p>
                            <p style="font-size:0.75em; opacity:0.7; margin-top:2px;">🌍 ${flight.country}</p>
                        </div>
                        <div class="flight-stats">
                            <div>⚡ ${flight.speed} km/h</div>
                            <span>📏 ${flight.altitude.toLocaleString()} ft</span>
                        </div>
                    </div>
                `;
            });
        }

        function filterFlights() {
            const query = document.getElementById('flight-code').value.trim().toUpperCase();
            const statusMsg = document.getElementById('status-msg');

            if (!query) {
                displayFlights(europeanFlights);
                statusMsg.innerText = `Avrupa'da aktif ${europeanFlights.length} uçuş listeleniyor.`;
                return;
            }

            const filtered = europeanFlights.filter(flight => {
                return flight.code.toUpperCase().includes(query) || 
                       flight.airline.toUpperCase().includes(query) || 
                       flight.route.toUpperCase().includes(query);
            });

            statusMsg.innerText = `"${query}" için ${filtered.length} sonuç bulundu.`;
            displayFlights(filtered);
        }

        // Sayfa açıldığında listeyi yükle
        displayFlights(europeanFlights);
    </script>
</body>
</html>
