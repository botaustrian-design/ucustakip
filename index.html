<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroRadar Pro</title>
    <style>
        :root {
            --bg-primary: #070d1a;
            --bg-secondary: #0f172a;
            --card-bg: #1e293b;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
        }
        body { margin: 0; padding: 20px; font-family: sans-serif; background: #070d1a; color: white; }
        .app-container { max-width: 480px; margin: auto; }
        .flight-card { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #334155; }
        .logo { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; }
        .info { margin-left: 15px; flex-grow: 1; }
        .details { text-align: right; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="app-container">
        <h1 style="text-align:center; color:#38bdf8;">AeroRadar Pro</h1>
        <div id="feed-container"></div>
    </div>
    <script>
        const flightsData = [
            { code: "THY1920", airline: "Turkish Airlines", color: "#c8102e", logoText: "TK", route: "Istanbul - Vienna", speed: "850 km/h", alt: "36.000 ft" },
            { code: "DLH422", airline: "Lufthansa", color: "#05164d", logoText: "LH", route: "Frankfurt - New York", speed: "890 km/h", alt: "38.000 ft" },
            { code: "AUA456", airline: "Austrian Airlines", color: "#e30613", logoText: "OS", route: "Vienna - Graz", speed: "450 km/h", alt: "18.000 ft" }
        ];
        const container = document.getElementById('feed-container');
        flightsData.forEach(f => {
            container.innerHTML += `
                <div class="flight-card">
                    <div style="display:flex; align-items:center;">
                        <div class="logo" style="background:${f.color}">${f.logoText}</div>
                        <div class="info">
                            <div style="font-weight:bold;">${f.code}</div>
                            <div style="font-size:0.75rem; color:#94a3b8;">${f.route}</div>
                        </div>
                    </div>
                    <div class="details">
                        <div style="color:#34d399;">${f.speed}</div>
                        <div style="color:#fbbf24;">${f.alt}</div>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
