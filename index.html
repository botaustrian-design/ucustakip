<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroRadar Pro</title>
    <style>
        :root {
            --bg-primary: #070d1a;
            --bg-secondary: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.65);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-blue: #38bdf8;
            --accent-green: #34d399;
            --accent-gold: #fbbf24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            margin: 0; padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-main);
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box;
        }
        .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
        .app-header { text-align: center; }
        .app-header h1 { margin: 0; font-size: 1.5em; color: var(--accent-blue); }
        .search-input { width: 100%; padding: 14px 16px 14px 44px; border-radius: 14px; border: 1px solid var(--border-color); background: rgba(15, 23, 42, 0.8); color: white; box-sizing: border-box; outline: none; }
        .flight-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; cursor: pointer; }
        .airline-logo { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="app-header">
            <h1>AeroRadar Pro</h1>
            <p style="color:var(--text-muted); font-size:0.8rem;">AVRUPA CANLI UÇUŞ TAKİP SİSTEMİ</p>
        </div>

        <input type="text" class="search-input" id="flight-code" placeholder="Uçuş kodu ara..." onkeyup="filterFlights()">

        <div id="feed-container"></div>
    </div>

    <script>
        const flightsData = [
            { code: "THY1920", airline: "Turkish Airlines", color: "#c8102e", logoText: "TK", route: "Istanbul - Vienna", speed: "850 km/h", alt: "36.000 ft" },
            { code: "DLH422", airline: "Lufthansa", color: "#05164d", logoText: "LH", route: "Frankfurt - New York", speed: "890 km/h", alt: "38.000 ft" },
            { code: "AUA456", airline: "Austrian Airlines", color: "#e30613", logoText: "OS", route: "Vienna - Graz", speed: "450 km/h", alt: "18.000 ft" }
        ];

        function renderFeed(items) {
            const container = document.getElementById('feed-container');
            container.innerHTML = '';
            items.forEach(f => {
                container.innerHTML += `
                    <div class="flight-card">
                        <div style="display:flex; align-items:center; gap:12px;">
                            <div class="airline-logo" style="background:${f.color}">${f.logoText}</div>
                            <div>
                                <h3 style="margin:0; font-size:1rem;">${f.code}</h3>
                                <p style="margin:2px 0 0 0; font-size:0.75rem; color:#94a3b8;">${f.route}</p>
                            </div>
                        </div>
                        <div style="text-align:right; font-size:0.85rem; font-weight:bold;">
                            <div style="color:#34d399;">⚡ ${f.speed}</div>
                            <div style="color:#fbbf24; font-size:0.75rem;">📉 ${f.alt}</div>
                        </div>
                    </div>
                `;
            });
        }

        function filterFlights() {
            const query = document.getElementById('flight-code').value.toUpperCase();
            const filtered = flightsData.filter(f => f.code.includes(query) || f.route.toUpperCase().includes(query));
            renderFeed(filtered);
        }

        // Sayfa açıldığı an yükle
        renderFeed(flightsData);
    </script>
</body>
</html>
