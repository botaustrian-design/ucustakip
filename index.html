<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Avrupa Uçuş Takip</title>
    <style>
        body {
            margin: 0;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h2 { text-align: center; margin: 0; color: #60a5fa; font-size: 1.4em; }
        .subtitle { text-align: center; font-size: 0.85em; color: #94a3b8; margin-bottom: 5px; }

        .search-box {
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 1em;
            outline: none;
        }

        input::placeholder { color: rgba(255, 255, 255, 0.6); }

        button {
            padding: 0 20px;
            border-radius: 10px;
            border: none;
            background: #3b82f6;
            color: white;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
        }

        button:active { background: #2563eb; }

        #status-msg {
            text-align: center;
            opacity: 0.8;
            font-size: 0.9em;
            padding: 10px;
        }

        /* Uçuş Kartları Listesi */
        .flight-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 65vh;
            overflow-y: auto;
        }

        .flight-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .flight-info h4 { margin: 0 0 5px 0; color: #93c5fd; font-size: 1.05em; }
        .flight-info p { margin: 0; font-size: 0.85em; color: #cbd5e1; }

        .flight-stats {
            text-align: right;
            font-size: 0.9em;
        }

        .flight-stats div { color: #34d399; font-weight: bold; }
        .flight-stats span { color: #fbbf24; font-size: 0.85em; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Avrupa Hava Sahası</h2>
        <div class="subtitle">Canlı Uçuş ve Hız/Yükseklik Takibi</div>

        <div class="search-box">
            <input type="text" id="flight-code" placeholder="Uçuş kodu ara (Örn: DLH, THY)..." onkeyup="filterFlights()">
            <button onclick="filterFlights()">Ara</button>
        </div>

        <div id="status-msg">Avrupa üzerindeki uçaklar yükleniyor...</div>

        <div class="flight-list" id="list-container"></div>
    </div>

    <script>
        let allEuropeanFlights = [];

        function fetchEuropeanFlights() {
            // Sadece Avrupa koordinatları (Güney, Kuzey, Batı, Doğu)
            const euroBBox = 'lamin=35&lamax=71&lomin=-25&lomax=45';
            const targetUrl = `https://opensky-network.org/api/states/all?${euroBBox}`;
            const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl);

            fetch(proxyUrl)
                .then(res => res.json())
                .then(data => {
                    if (!data || !data.states) {
                        document.getElementById('status-msg').innerText = 'Veri alınamadı. Lütfen tekrar deneyin.';
                        return;
                    }

                    allEuropeanFlights = data.states;
                    document.getElementById('status-msg').innerText = `Avrupa'da aktif ${allEuropeanFlights.length} uçuş bulundu.`;
                    displayFlights(allEuropeanFlights.slice(0, 30)); // İlk 30 uçağı göster
                })
                .catch(err => {
                    document.getElementById('status-msg').innerText = 'Bağlantı hatası oluştu.';
                });
        }

        function displayFlights(flights) {
            const container = document.getElementById('list-container');
            container.innerHTML = '';

            if (flights.length === 0) {
                container.innerHTML = '<div style="text-align:center; opacity:0.6;">Uçuş bulunamadı.</div>';
                return;
            }

            flights.forEach(flight => {
                const callsign = flight[1] ? flight[1].trim() : 'Bilinmiyor';
                const country = flight[2] || 'Bilinmiyor';
                const speedKmh = flight[9] ? Math.round(flight[9] * 3.6) : 0;
                const altitudeFt = flight[7] ? Math.round(flight[7] * 3.28084) : 0;

                container.innerHTML += `
                    <div class="flight-card">
                        <div class="flight-info">
                            <h4>✈️ ${callsign}</h4>
                            <p>🌍 Ülke: ${country}</p>
                        </div>
                        <div class="flight-stats">
                            <div>⚡ ${speedKmh} km/h</div>
                            <span>📏 ${altitudeFt.toLocaleString()} ft</span>
                        </div>
                    </div>
                `;
            });
        }

        function filterFlights() {
            const query = document.getElementById('flight-code').value.trim().toUpperCase();
            if (!query) {
                displayFlights(allEuropeanFlights.slice(0, 30));
                document.getElementById('status-msg').innerText = `Avrupa'da aktif ${allEuropeanFlights.length} uçuş bulundu.`;
                return;
            }

            const filtered = allEuropeanFlights.filter(flight => {
                const callsign = flight[1] ? flight[1].trim().toUpperCase() : '';
                return callsign.includes(query);
            });

            document.getElementById('status-msg').innerText = `"${query}" için ${filtered.length} sonuç bulundu.`;
            displayFlights(filtered);
        }

        // Sayfa açıldığında veriyi çek
        fetchEuropeanFlights();
    </script>
</body>
</html>
