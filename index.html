<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroRadar Pro</title>
    <style>
        body { background-color: #070d1a; color: white; font-family: sans-serif; padding: 20px; }
        .card { background: #1e293b; padding: 15px; margin-top: 10px; border-radius: 10px; border: 1px solid #334155; }
        .input-box { width: 100%; padding: 10px; border-radius: 8px; border: none; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h1>AeroRadar Pro</h1>
    <input type="text" class="input-box" id="search" placeholder="Uçuş ara...">
    
    <!-- Liste buraya eklenecek -->
    <div id="flight-list"></div>

    <script>
        const flights = [
            { code: "THY1920", route: "IST-VIE" },
            { code: "DLH422", route: "FRA-JFK" },
            { code: "AUA456", route: "VIE-GRZ" }
        ];

        const listDiv = document.getElementById('flight-list');

        function showFlights() {
            listDiv.innerHTML = ""; // Önce temizle
            flights.forEach(f => {
                listDiv.innerHTML += `<div class="card"><strong>${f.code}</strong> - ${f.route}</div>`;
            });
        }

        // SAYFANIN EN ALTINDA HEMEN ÇALIŞTIR
        showFlights();
        console.log("Radar aktif!");
    </script>
</body>
</html>
